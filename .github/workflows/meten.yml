# Meet BoerGPT op de testvragen. Start hem met "Run workflow" op het tabblad Actions.
name: Meten
on:
  workflow_dispatch:
    inputs:
      wat:
        description: "zoek (alleen het zoeken, geen sleutels nodig), open of claude"
        type: choice
        options: [zoek, open, claude]
        default: zoek
      apart:
        description: "De apart gehouden vragen meten (alleen op het einde)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  meet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meten
        env:
          GROQ_KEY_FOR_BOERGPT: ${{ secrets.GROQ_KEY_FOR_BOERGPT }}
          ANTHROPIC_KEY_FOR_BOERGPT: ${{ secrets.ANTHROPIC_KEY_FOR_BOERGPT }}
          CLOUDFLARE_ACCOUNT_ID_FOR_BOERGPT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_FOR_BOERGPT }}
          CLOUDFLARE_AI_TOKEN_FOR_BOERGPT: ${{ secrets.CLOUDFLARE_AI_TOKEN_FOR_BOERGPT }}
          WAT: ${{ inputs.wat }}
          APART: ${{ inputs.apart && '--apart' || '' }}
        run: |
          node test/meet.mjs "$WAT" $APART | tee uitslag.txt
          { echo '```'; cat uitslag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: uitslag
          path: test/uitslag-*.json
