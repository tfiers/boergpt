# Meet BoerGPT op de testvragen. Start hem met "Run workflow" op het tabblad Actions.
name: Meten
on:
  workflow_dispatch:
    inputs:
      wat:
        description: "zoek (alleen het zoeken), open, claude, aanval-… (20 aanvallen, red team), rechter (opnieuw oordelen over metingen/*.json waar het oordeel ontbreekt), of modellen (welke modellen de aanbieders hebben)"
        type: choice
        options: [zoek, open, claude, aanval-open, aanval-claude, rechter, modellen]
        default: zoek
      deel:
        description: "oefen, apart (alleen op het einde) of echt (vragen van echte boeren en adviseurs)"
        type: choice
        options: [oefen, apart, echt]
        default: oefen
      model:
        description: "Open model als aanbieder:model, bv. groq:qwen/qwen3-32b of cloudflare:@cf/openai/gpt-oss-120b (leeg: eerst Groq, dan Cloudflare)"
        type: string
        default: ""
      max:
        description: "Hoogstens zoveel vragen (leeg: allemaal)"
        type: string
        default: ""
      rechter:
        description: "Laat Claude ook oordelen over elk antwoord"
        type: boolean
        default: false
      kost_max:
        description: "Plafond in dollar voor deze meting (test/kost.mjs); de geschatte kost staat bovenaan het verslag"
        type: string
        default: "1"
      rechter_model:
        description: "Rechter: leeg voor Claude Sonnet 5.5, of een model op Cloudflare, bv. @cf/meta/llama-3.3-70b-instruct-fp8-fast"
        type: string
        default: ""
      claude_model:
        description: "Claude-model voor wat=claude of aanval-claude (de demo gebruikt Sonnet 5.5)"
        type: choice
        options: [claude-sonnet-5-5, claude-haiku-5-5, claude-opus-5-5]
        default: claude-sonnet-5-5
      opties:
        description: "Andere instelling van het zoeken, als JSON, bv. {\"aantal\":8}"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  meet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meten
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_METINGEN_API_KEY }}  # eigen werkruimte en limiet, apart van de demo
          # Alleen t.e.m. 20 nov 2026, zolang de metingensleutel er niet is: de sleutel van de demo,
          # met een plafond per meting.
          DEMO_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ inputs.claude_model }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WACHT_MAX: 90
          TIJD_MAX: 180
          WAT: ${{ inputs.wat }}
          DEEL: ${{ inputs.deel }}
          MODEL: ${{ inputs.model }}
          MAX: ${{ inputs.max }}
          OPTIES: ${{ inputs.opties }}
          KOST_MAX: ${{ inputs.kost_max }}
          RECHTER_MODEL: ${{ inputs.rechter_model }}
          RECHTER: ${{ inputs.rechter && '--rechter' || '' }}
        run: |
          set -o pipefail
          if [ "$WAT" = modellen ]; then
            curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" | jq -r '.data[].id' | sort | sed 's/^/groq:/'
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/models/search?task=Text%20Generation&per_page=100" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[].name' | sort | sed 's/^/cloudflare:/'
            exit 0
          fi
          if [ -z "$RECHTER_MODEL" ]; then unset RECHTER_MODEL; fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "$(TZ=Europe/Brussels date +%F)" \< 2026-11-21 ]; then export ANTHROPIC_API_KEY="$DEMO_KEY"; fi
          unset DEMO_KEY
          if [ "$WAT" = rechter ]; then
            node test/rechter.mjs metingen/*.json | tee uitslag.txt
            { echo '```'; cat uitslag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$MODEL" ]; then export OPEN_VIA="${MODEL%%:*}" OPEN_MODEL="${MODEL#*:}"; fi
          case "$WAT" in aanval-*)
            node test/aanval.mjs "${WAT#aanval-}" | tee uitslag.txt
            { echo '```'; cat uitslag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "UITSLAG-JSON-BEGIN"; cat test/uitslag-*.json | jq -c .; echo "UITSLAG-JSON-EINDE"
            exit 0;;
          esac
          set -- "$WAT" --deel "$DEEL"
          [ -n "$MAX" ] && set -- "$@" --max "$MAX"
          [ -n "$OPTIES" ] && set -- "$@" --opties "$OPTIES"
          [ -n "$RECHTER" ] && set -- "$@" --rechter
          node test/meet.mjs "$@" | tee uitslag.txt
          { echo '```'; cat uitslag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "UITSLAG-JSON-BEGIN"; cat test/uitslag-*.json | jq -c .; echo "UITSLAG-JSON-EINDE"
      - uses: actions/upload-artifact@v4
        if: inputs.wat != 'modellen'
        with:
          name: uitslag
          path: |
            test/uitslag-*.json
            metingen/*.json
